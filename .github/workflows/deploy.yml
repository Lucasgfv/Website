name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch: # allows a manual run from the Actions tab

permissions:
  id-token: write # needed to request the OIDC token that AWS trusts
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Skip until the AWS setup is done (repo variables created).
    if: vars.AWS_ROLE_ARN != ''
    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Upload site
        # Only public files go to the bucket (never README, infra/, .github/).
        run: |
          mkdir -p dist
          cp index.html dist/
          aws s3 sync dist/ "s3://${{ vars.S3_BUCKET }}/" --delete \
            --cache-control "public, max-age=300"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
